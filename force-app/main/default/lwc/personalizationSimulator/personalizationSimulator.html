<template>
    <lightning-card title="Personalization Simulator" icon-name="utility:connected_apps">

        <!-- ── Config ─────────────────────────────────────────── -->
        <div class="slds-m-around_medium">
            <div class="slds-grid slds-gutters slds-wrap">

                <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
                    <lightning-input
                        label={tseFieldLabel}
                        value={tseBaseUrl}
                        onchange={handleTseUrlChange}
                        placeholder="https://m-xxxx.c360a.salesforce.com"
                        variant="label-stacked">
                    </lightning-input>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <lightning-input
                        label="Org Base URL"
                        value={orgBaseUrl}
                        onchange={handleOrgBaseUrlChange}
                        placeholder="https://myorg.my.salesforce.com"
                        variant="label-stacked">
                    </lightning-input>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <lightning-input
                        label="Personalization Point"
                        value={ppApiName}
                        disabled
                        variant="label-stacked">
                    </lightning-input>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <lightning-combobox
                        label="Decisioning endpoint"
                        value={authMode}
                        options={authModeOptions}
                        onchange={handleAuthModeChange}
                        variant="label-stacked"
                        data-id="auth-mode">
                    </lightning-combobox>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small" data-id="requires-auth">{requiresAuthLabel}</p>
                </div>
            </div>

            <!-- ── Global error ──────────────────────────────── -->
            <template if:true={globalError}>
                <div class="slds-notify slds-notify_alert slds-theme_error slds-m-top_small" role="alert">
                    <lightning-icon icon-name="utility:error" size="x-small"
                        alternative-text="Error" class="slds-m-right_x-small">
                    </lightning-icon>
                    {globalError}
                </div>
            </template>
        </div>

        <!-- ── Request Context ──────────────────────────────────── -->
        <div class="slds-m-horizontal_medium slds-m-bottom_medium">
            <p class="slds-text-title_caps slds-text-color_weak slds-m-bottom_x-small">Request Context</p>
            <div class="slds-grid slds-gutters slds-wrap">

                <div class="slds-col slds-size_1-of-1">
                    <lightning-input
                        label="Request URL"
                        value={requestUrl}
                        onchange={handleRequestUrlChange}
                        placeholder="https://www.example.com/page"
                        variant="label-stacked">
                    </lightning-input>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        label="Page Type"
                        value={pageType}
                        onchange={handlePageTypeChange}
                        placeholder="e.g. Courses"
                        variant="label-stacked">
                    </lightning-input>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        label="Interaction"
                        value={interaction}
                        onchange={handleInteractionChange}
                        placeholder="e.g. View Catalog Object"
                        variant="label-stacked">
                    </lightning-input>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <lightning-input
                        label="Channel"
                        value={channel}
                        onchange={handleChannelChange}
                        placeholder="Web"
                        variant="label-stacked">
                    </lightning-input>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <lightning-input
                        label="Channel Context"
                        value={channelContext}
                        onchange={handleChannelContextChange}
                        placeholder="e.g. www.example.com"
                        variant="label-stacked">
                    </lightning-input>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <lightning-input
                        label="Request Timezone"
                        value={requestTimeZone}
                        onchange={handleRequestTimeZoneChange}
                        placeholder="e.g. America/Vancouver"
                        variant="label-stacked">
                    </lightning-input>
                </div>

            </div>
        </div>

        <!-- ── Decision context (custom key/value pairs) ─────────── -->
        <div class="slds-m-horizontal_medium slds-m-bottom_medium">
            <p class="slds-text-title_caps slds-text-color_weak slds-m-bottom_x-small">Decision Context</p>
            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                Extra keys sent in the request context, for example a product ID used by a recommender's dynamic context filter.
                A value in JSON form (object or array) is sent as JSON.
            </p>
            <template for:each={contextRows} for:item="row">
                <div key={row.id} class="slds-grid slds-gutters_x-small slds-m-bottom_x-small context-row">
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-input value={row.key} data-id={row.id} data-field="key"
                            onchange={handleContextRowChange} placeholder="Key, e.g. productId" variant="label-hidden">
                        </lightning-input>
                    </div>
                    <div class="slds-col">
                        <lightning-input value={row.value} data-id={row.id} data-field="value"
                            onchange={handleContextRowChange} placeholder="Value" variant="label-hidden">
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-no-flex slds-align-middle">
                        <lightning-button-icon icon-name="utility:delete" data-id={row.id}
                            onclick={handleRemoveContextRow} variant="bare" size="small" alternative-text="Remove key">
                        </lightning-button-icon>
                    </div>
                </div>
            </template>
            <template if:true={ignoredContextKeys}>
                <p class="slds-text-body_small slds-text-color_error slds-m-bottom_x-small">{ignoredContextKeys}</p>
            </template>
            <lightning-button label="Add key" icon-name="utility:add" onclick={handleAddContextRow}
                variant="neutral" data-id="add-context-row">
            </lightning-button>
        </div>

        <!-- ── Experience template (optional preview) ───────────── -->
        <div class="slds-m-horizontal_medium slds-m-bottom_medium">
            <lightning-textarea
                label="Experience template (optional)"
                value={templateText}
                onchange={handleTemplateChange}
                placeholder="Paste the point's Handlebars template, e.g. <h2>{{attributes.header}}</h2>{{#each data}}<p>{{name}}</p>{{/each}}"
                field-level-help="Each result gets a Preview view that renders the response through this template in a sandboxed frame (no scripts). Supports variables, {{{raw}}}, #if, #unless, #each, #with and else."
                class="template-input">
            </lightning-textarea>
        </div>

        <!-- ── Visitor Entries ────────────────────────────────── -->
        <div class="slds-m-horizontal_medium slds-m-bottom_medium">

            <div class="slds-grid slds-gutters_x-small slds-m-bottom_x-small">
                <div class="slds-col">
                    <p class="slds-text-title_caps slds-text-color_weak">
                        Individual / Device IDs &nbsp;
                        <span class="slds-badge">{entryCount}</span>
                    </p>
                </div>
            </div>

            <!-- Entry rows -->
            <template for:each={entries} for:item="entry">
                <div key={entry.key} class="entry-row slds-grid slds-gutters_x-small slds-m-bottom_x-small">

                    <!-- Source badge -->
                    <div class="slds-col slds-no-flex slds-align-middle">
                        <span class={entry.sourceBadgeClass}>{entry.sourceLabel}</span>
                    </div>

                    <!-- ID input -->
                    <div class="slds-col">
                        <lightning-input
                            value={entry.individualId}
                            data-key={entry.key}
                            onchange={handleEntryIdChange}
                            placeholder="e.g. d0cf39a5824a008d"
                            variant="label-hidden">
                        </lightning-input>
                    </div>

                    <!-- Remove button -->
                    <template if:true={canRemove}>
                        <div class="slds-col slds-no-flex slds-align-middle">
                            <lightning-button-icon
                                icon-name="utility:delete"
                                data-key={entry.key}
                                onclick={handleRemoveEntry}
                                variant="bare"
                                size="small"
                                alternative-text="Remove visitor">
                            </lightning-button-icon>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Add + Simulate controls -->
            <div class="slds-grid slds-gutters slds-m-top_small slds-wrap">

                <!-- Add Random -->
                <div class="slds-col slds-no-flex">
                    <lightning-button
                        label="Add Random"
                        icon-name="utility:add"
                        onclick={handleAddRandom}
                        variant="neutral"
                        disabled={isSimulating}>
                    </lightning-button>
                </div>

                <!-- Add from Recent -->
                <template if:true={hasRecentIds}>
                    <div class="slds-col slds-no-flex">
                        <lightning-combobox
                            label="Add Recent Visitor"
                            placeholder="— pick —"
                            options={recentIdOptions}
                            onchange={handleAddRecent}
                            variant="label-hidden"
                            class="recent-picker-inline"
                            disabled={isSimulating}>
                        </lightning-combobox>
                    </div>
                </template>

                <!-- Simulate button (right-aligned) -->
                <div class="slds-col slds-align-bottom" style="margin-left: auto;">
                    <lightning-button
                        label={simulateButtonLabel}
                        icon-name="utility:play"
                        onclick={handleSimulate}
                        variant="brand"
                        disabled={isSimulating}>
                    </lightning-button>
                </div>
            </div>
        </div>

        <!-- ── Results Tabs ───────────────────────────────────── -->
        <template if:true={hasResults}>
            <div class="slds-m-around_medium">
                <lightning-tabset>
                    <template for:each={entriesView} for:item="entry">
                        <lightning-tab key={entry.key} label={entry.tabLabel} value={entry.key}>

                            <!-- Loading -->
                            <template if:true={entry.isLoading}>
                                <div class="slds-m-around_medium slds-align_absolute-center">
                                    <lightning-spinner
                                        alternative-text="Calling Decisioning API..."
                                        size="medium">
                                    </lightning-spinner>
                                    <p class="slds-m-top_small slds-text-color_weak">
                                        Calling Decisioning API...
                                    </p>
                                </div>
                            </template>

                            <!-- Error -->
                            <template if:true={entry.error}>
                                <div class="slds-notify slds-notify_alert slds-theme_error slds-m-around_medium" role="alert">
                                    <lightning-icon icon-name="utility:error" size="x-small"
                                        alternative-text="Error" class="slds-m-right_x-small">
                                    </lightning-icon>
                                    {entry.error}
                                </div>
                                <template if:true={entry.mode}>
                                    <p class="slds-m-horizontal_medium slds-text-body_small slds-text-color_weak">
                                        <span class={entry.modeBadgeClass}>{entry.mode}</span> {entry.modeDetail}
                                    </p>
                                </template>
                                <template if:true={entry.hasModeNotes}>
                                    <ul class="slds-m-horizontal_medium slds-text-body_small slds-text-color_weak">
                                        <template for:each={entry.modeNotes} for:item="note">
                                            <li key={note}>{note}</li>
                                        </template>
                                    </ul>
                                </template>
                            </template>

                            <!-- Result -->
                            <template if:true={entry.hasResult}>

                                <!-- Status bar -->
                                <div class="slds-grid slds-gutters slds-m-bottom_small slds-m-top_small slds-align_absolute-center">
                                    <div class="slds-col slds-no-flex">
                                        <span class={entry.statusBadgeClass}>HTTP {entry.httpStatus}</span>
                                    </div>
                                    <div class="slds-col slds-no-flex slds-m-left_small">
                                        <span class="slds-text-color_weak slds-text-body_small">
                                            Request ID: {entry.requestId}
                                        </span>
                                    </div>
                                    <div class="slds-col slds-no-flex slds-m-left_small">
                                        <span class="slds-text-color_weak slds-text-body_small">
                                            Personalization ID: {entry.personalizationId}
                                        </span>
                                    </div>
                                    <div class="slds-col slds-no-flex slds-m-left_small">
                                        <span class={entry.modeBadgeClass} title={entry.modeDetail} data-id="mode-badge">{entry.mode}</span>
                                    </div>
                                </div>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small" data-id="mode-detail">{entry.modeDetail}</p>
                                <template if:true={entry.hasModeNotes}>
                                    <ul class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                                        <template for:each={entry.modeNotes} for:item="note">
                                            <li key={note}>{note}</li>
                                        </template>
                                    </ul>
                                </template>

                                <!-- What answered -->
                                <div class="slds-box slds-m-bottom_medium answered-block">
                                    <div class="slds-grid" style="align-items: center;">
                                        <p class="slds-col slds-text-title_caps">What answered</p>
                                        <div class="slds-col slds-no-flex">
                                            <lightning-button label="Look up in logs" icon-name="utility:search"
                                                data-key={entry.key} onclick={handleLogLookup}
                                                variant="neutral" disabled={entry.logLoading} data-id="log-lookup">
                                            </lightning-button>
                                        </div>
                                    </div>
                                    <template if:true={entry.hasAnswerInfo}>
                                        <template for:each={entry.answerInfo} for:item="info">
                                            <div key={info.path} class="slds-grid slds-gutters_x-small">
                                                <span class="slds-col slds-no-flex slds-text-body_small slds-text-color_weak attr-key">{info.path}</span>
                                                <span class="slds-col slds-text-body_small">{info.value}</span>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:false={entry.hasAnswerInfo}>
                                        <p class="slds-text-body_small slds-text-color_weak">
                                            The response does not name the decision or cohort. Look up in logs reads the Personalization Log
                                            and A/B Experiment Log by request ID; logs arrive several minutes after the request.
                                        </p>
                                    </template>
                                    <template if:true={entry.logLoading}>
                                        <lightning-spinner alternative-text="Reading logs..." size="small"></lightning-spinner>
                                    </template>
                                    <template if:true={entry.logMessage}>
                                        <p class="slds-text-body_small slds-m-top_x-small" data-id="log-message">{entry.logMessage}</p>
                                    </template>
                                    <template if:true={entry.hasLogEntries}>
                                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-top_x-small" data-id="log-table">
                                            <thead>
                                                <tr>
                                                    <th scope="col">Decision</th>
                                                    <th scope="col">Personalizer</th>
                                                    <th scope="col">Experiment</th>
                                                    <th scope="col">Cohort</th>
                                                    <th scope="col">Treatment</th>
                                                    <th scope="col">Status</th>
                                                    <th scope="col">Time</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={entry.logEntries} for:item="log">
                                                    <tr key={log.id}>
                                                        <td>{log.decision}</td>
                                                        <td>{log.personalizer}</td>
                                                        <td>{log.experiment}</td>
                                                        <td>{log.cohort}</td>
                                                        <td>{log.treatment}</td>
                                                        <td>{log.statusCode}</td>
                                                        <td>{log.requestDateTime}</td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </template>
                                </div>

                                <!-- Attributes -->
                                <template if:true={entry.attributeItems.length}>
                                    <div class="slds-box slds-m-bottom_medium attribute-block">
                                        <p class="slds-text-title_caps slds-m-bottom_x-small">Attributes</p>
                                        <template for:each={entry.attributeItems} for:item="attr">
                                            <div key={attr.key} class="slds-grid slds-gutters_x-small">
                                                <span class="slds-col slds-no-flex slds-text-body_small slds-text-color_weak attr-key">
                                                    {attr.key}
                                                </span>
                                                <span class="slds-col slds-text-body_small attr-value">
                                                    {attr.value}
                                                </span>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- View toggle -->
                                <div class="slds-grid slds-m-bottom_small" style="gap: 0.5rem; align-items: center;">
                                    <div class="slds-col slds-no-flex">
                                        <div class="slds-button-group" role="group">
                                            <button class="slds-button slds-button_neutral"
                                                data-key={entry.key} data-view="table"
                                                onclick={handleTabToggle}>
                                                Table
                                            </button>
                                            <button class="slds-button slds-button_neutral"
                                                data-key={entry.key} data-view="request"
                                                onclick={handleTabToggle}>
                                                Request
                                            </button>
                                            <button class="slds-button slds-button_neutral"
                                                data-key={entry.key} data-view="json"
                                                onclick={handleTabToggle}>
                                                Response
                                            </button>
                                            <button class="slds-button slds-button_neutral"
                                                data-key={entry.key} data-view="datagraph"
                                                onclick={handleTabToggle}>
                                                Data Graph
                                            </button>
                                            <template if:true={hasTemplate}>
                                                <button class="slds-button slds-button_neutral"
                                                    data-key={entry.key} data-view="preview"
                                                    onclick={handleTabToggle}>
                                                    Preview
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-no-flex">
                                        <lightning-button
                                            label="Lookup Profile"
                                            icon-name="utility:identity"
                                            data-key={entry.key}
                                            onclick={handleDataGraphLookup}
                                            variant="neutral"
                                            size="small"
                                            disabled={entry.dataGraphLoading}>
                                        </lightning-button>
                                    </div>
                                </div>

                                <!-- Table View -->
                                <template if:true={entry.showTable}>
                                    <template if:true={entry.tableRows.length}>
                                        <div class="result-table-wrapper">
                                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                                                <thead>
                                                    <tr class="slds-line-height_reset">
                                                        <template for:each={entry.tableColumns} for:item="col">
                                                            <th key={col.fieldName} scope="col">
                                                                <div class="slds-truncate" title={col.label}>{col.label}</div>
                                                            </th>
                                                        </template>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template for:each={entry.tableRows} for:item="row">
                                                        <tr key={row.id}>
                                                            <template for:each={row.cells} for:item="cell">
                                                                <td key={cell.fieldName} data-label={cell.label}>
                                                                    <template if:true={cell.isImage}>
                                                                        <img src={cell.value} alt={cell.label} class="product-thumbnail" />
                                                                    </template>
                                                                    <template if:true={cell.isUrl}>
                                                                        <a href={cell.value} target="_blank" rel="noopener noreferrer">{cell.value}</a>
                                                                    </template>
                                                                    <template if:true={cell.isText}>
                                                                        <div class="slds-truncate" title={cell.value}>{cell.value}</div>
                                                                    </template>
                                                                </td>
                                                            </template>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </template>
                                    <template if:false={entry.tableRows.length}>
                                        <p class="slds-text-color_weak">No data returned for this visitor.</p>
                                    </template>
                                </template>

                                <!-- Request JSON View -->
                                <template if:true={entry.showRequest}>
                                    <div class="json-wrapper">
                                        <pre class="json-block">{entry.rawRequestJson}</pre>
                                    </div>
                                </template>

                                <!-- Response JSON View -->
                                <template if:true={entry.showJson}>
                                    <div class="json-wrapper">
                                        <pre class="json-block">{entry.rawJson}</pre>
                                    </div>
                                </template>

                                <!-- Template Preview View -->
                                <template if:true={entry.showPreview}>
                                    <template if:true={entry.previewError}>
                                        <p class="slds-text-color_error" data-id="preview-error">{entry.previewError}</p>
                                    </template>
                                    <template if:true={entry.previewSrc}>
                                        <iframe class="template-preview" sandbox="" src={entry.previewSrc}
                                            title="Experience template preview" data-id="preview-frame"></iframe>
                                        <details class="slds-m-top_x-small">
                                            <summary class="slds-text-body_small">Rendered HTML</summary>
                                            <div class="json-wrapper">
                                                <pre class="json-block" data-id="preview-html">{entry.previewHtml}</pre>
                                            </div>
                                        </details>
                                    </template>
                                </template>

                                <!-- Data Graph View -->
                                <template if:true={entry.showDataGraph}>
                                    <template if:true={entry.dataGraphLoading}>
                                        <div class="slds-m-around_medium slds-align_absolute-center">
                                            <lightning-spinner alternative-text="Fetching Data Graph..." size="medium"></lightning-spinner>
                                            <p class="slds-m-top_small slds-text-color_weak">Fetching Data Graph profile...</p>
                                        </div>
                                    </template>
                                    <template if:true={entry.dataGraphError}>
                                        <div class="slds-notify slds-notify_alert slds-theme_error slds-m-around_medium" role="alert">
                                            <lightning-icon icon-name="utility:error" size="x-small"
                                                alternative-text="Error" class="slds-m-right_x-small">
                                            </lightning-icon>
                                            {entry.dataGraphError}
                                        </div>
                                    </template>
                                    <template if:true={entry.dataGraphResult}>
                                        <div class="json-wrapper">
                                            <pre class="json-block">{entry.dataGraphResult}</pre>
                                        </div>
                                    </template>
                                    <template if:false={entry.dataGraphLoading}>
                                        <template if:false={entry.dataGraphResult}>
                                            <template if:false={entry.dataGraphError}>
                                                <p class="slds-text-color_weak slds-m-around_medium">
                                                    Click "Lookup Profile" to fetch the Data Graph profile for this visitor.
                                                </p>
                                            </template>
                                        </template>
                                    </template>
                                </template>

                            </template>

                            <!-- Data Graph lookup available even without a simulate result -->
                            <template if:false={entry.hasResult}>
                                <template if:false={entry.isLoading}>
                                    <div class="slds-m-around_medium">
                                        <div class="slds-grid slds-gutters slds-m-bottom_small" style="align-items: center;">
                                            <p class="slds-col slds-text-color_weak slds-text-body_small">
                                                Lookup this visitor's Data Graph profile without simulating.
                                            </p>
                                            <div class="slds-col slds-no-flex">
                                                <lightning-button
                                                    label="Lookup Profile"
                                                    icon-name="utility:identity"
                                                    data-key={entry.key}
                                                    onclick={handleDataGraphLookup}
                                                    variant="neutral"
                                                    disabled={entry.dataGraphLoading}>
                                                </lightning-button>
                                            </div>
                                        </div>

                                        <template if:true={entry.dataGraphLoading}>
                                            <div class="slds-align_absolute-center slds-m-top_medium">
                                                <lightning-spinner alternative-text="Fetching Data Graph..." size="medium"></lightning-spinner>
                                                <p class="slds-m-top_small slds-text-color_weak">Fetching Data Graph profile...</p>
                                            </div>
                                        </template>
                                        <template if:true={entry.dataGraphError}>
                                            <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                                                <lightning-icon icon-name="utility:error" size="x-small"
                                                    alternative-text="Error" class="slds-m-right_x-small">
                                                </lightning-icon>
                                                {entry.dataGraphError}
                                            </div>
                                        </template>
                                        <template if:true={entry.dataGraphResult}>
                                            <div class="json-wrapper">
                                                <pre class="json-block">{entry.dataGraphResult}</pre>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </template>
                        </lightning-tab>
                    </template>
                </lightning-tabset>
            </div>
        </template>

        <!-- ── Compare two visitors ───────────────────────────── -->
        <template if:true={canCompare}>
            <div class="slds-m-around_medium compare-block" data-id="compare">
                <p class="slds-text-title_caps slds-text-color_weak slds-m-bottom_x-small">Compare</p>
                <div class="slds-grid slds-gutters slds-wrap" style="align-items: flex-end;">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-5">
                        <lightning-combobox label="Visitor A" value={compareA} options={compareOptions}
                            onchange={handleCompareAChange} variant="label-stacked" data-id="compare-a">
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-5">
                        <lightning-combobox label="Visitor B" value={compareB} options={compareOptions}
                            onchange={handleCompareBChange} variant="label-stacked" data-id="compare-b">
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-5">
                        <lightning-input type="checkbox" label="Only differences" checked={onlyDiffs}
                            onchange={handleOnlyDiffsChange}>
                        </lightning-input>
                    </div>
                </div>
                <p class="slds-text-body_small slds-m-vertical_x-small" data-id="compare-summary">{compareSummary}</p>
                <template if:true={hasCompareRows}>
                    <div class="result-table-wrapper">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered" data-id="compare-table">
                            <thead>
                                <tr>
                                    <th scope="col">Field</th>
                                    <th scope="col">{compareLabelA}</th>
                                    <th scope="col">{compareLabelB}</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={compareRows} for:item="row">
                                    <tr key={row.path} class={row.rowClass}>
                                        <td class="compare-path">{row.path}</td>
                                        <td>{row.a}</td>
                                        <td>{row.b}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </div>
        </template>

    </lightning-card>
</template>
